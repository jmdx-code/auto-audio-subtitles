name: Release Browser Extension

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify extension layout
        run: test -f dist/manifest.json && test -f dist/vendor/ffmpeg-core.wasm && test -f dist/LICENSE && test -f dist/THIRD_PARTY_NOTICES.md && test -f dist/licenses/FFMPEG-GPL-2.0-OR-LATER.txt && test -f dist/licenses/EDGE-TTS-UNIVERSAL-AGPL-3.0.txt

      - name: Package extension
        run: |
          cd dist
          zip -r ../auto-audio-subtitles-${{ github.ref_name }}.zip .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "*.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
